endpoints:
  agents:
    capabilities: ["artifacts", "actions", "context", "skills", "tools"]
  custom:
    # 1. Google Gemini (Oficial Directo - Flash Lite y Flash)
    - name: "Google Gemini"
      apiKey: "${GEMINI_API_KEY}"
      baseURL: "https://generativelanguage.googleapis.com/v1beta/openai"
      models:
        default:
          - "gemini-flash-lite-latest"
          - "gemini-flash-latest"
          - "gemini-3.8-flash"
        fetch: false
      titleConvo: true
      titleModel: "gemini-flash-lite-latest"
      modelDisplayLabel: "Google Gemini (Flash Lite)"

    # 2. NVIDIA NIM (Cloud de GPUs NVIDIA Enterprise)
    - name: "NVIDIA NIM"
      apiKey: "${NVIDIA_API_KEY}"
      baseURL: "https://integrate.api.nvidia.com/v1"
      models:
        default:
          - "meta/llama-3.2-90b-vision-instruct"
          - "meta/llama-3.2-11b-vision-instruct"
        fetch: false
      titleConvo: true
      titleModel: "meta/llama-3.2-90b-vision-instruct"
      modelDisplayLabel: "NVIDIA NIM (GPUs Enterprise)"

    # 3. SiliconFlow (DeepSeek Hub)
    - name: "SiliconFlow"
      apiKey: "${SILICONFLOW_API_KEY}"
      baseURL: "https://api.siliconflow.com/v1"
      models:
        default:
          - "deepseek-ai/DeepSeek-V3"
          - "Qwen/Qwen3.5-9B"
        fetch: false
      titleConvo: true
      titleModel: "deepseek-ai/DeepSeek-V3"
      modelDisplayLabel: "SiliconFlow (DeepSeek)"

    # 4. Groq (LPU Ultra-Rápido)
    - name: "Groq"
      apiKey: "${GROQ_API_KEY}"
      baseURL: "https://api.groq.com/openai/v1"
      models:
        default:
          - "llama-3.3-70b-versatile"
          - "llama-3.1-8b-instant"
        fetch: false
      titleConvo: true
      titleModel: "llama-3.3-70b-versatile"
      modelDisplayLabel: "Groq (Ultra-Rápido)"

    # 5. Cerebras (LPU Ultra-Rápido)
    - name: "Cerebras"
      apiKey: "${CEREBRAS_API_KEY}"
      baseURL: "https://api.cerebras.ai/v1"
      models:
        default:
          - "llama-3.3-70b"
          - "llama3.1-8b"
        fetch: false
      titleConvo: true
      titleModel: "llama3.1-8b"
      modelDisplayLabel: "Cerebras (LPU 2k tok/s)"

    # 6. SambaNova (Llama)
    - name: "SambaNova"
      apiKey: "${SAMBANOVA_API_KEY}"
      baseURL: "https://api.sambanova.ai/v1"
      models:
        default:
          - "Meta-Llama-3.1-8B-Instruct"
          - "Meta-Llama-3.3-70B-Instruct"
        fetch: false
      titleConvo: true
      titleModel: "Meta-Llama-3.1-8B-Instruct"
      modelDisplayLabel: "SambaNova (Llama)"
